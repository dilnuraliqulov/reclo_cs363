name: reclo-cs363

services:
  postgres:
    image: postgres:18-alpine
    container_name: reclo-cs363-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reclo
      POSTGRES_PASSWORD: reclo
      POSTGRES_DB: reclo
    ports:
      # Host port 5435 avoids clashing with a Postgres already on 5432.
      - '127.0.0.1:5435:5432'
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reclo -d reclo']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the API sends in development (KAN-17); nothing leaves the machine.
  # SMTP on host port 1026, web inbox at http://localhost:8026. One above Mailpit's defaults, so it
  # does not clash with another project's Mailpit.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: reclo-cs363-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

volumes:
  pgdata:
